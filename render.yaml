services:
  - type: web
    name: nehsaan-clothing
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_SETUP_SECRET
        generateValue: true
      - key: WHATSAPP_ADMIN_RECIPIENT
        value: +923235277238
